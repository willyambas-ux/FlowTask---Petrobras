name: Publicar no Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', '.clasp.json']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar clasp
        run: npm install -g @google/clasp@3
      - name: Credencial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Segredo CLASPRC_JSON ausente"; exit 1; fi
          echo "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Enviar código
        run: clasp push --force
      - name: Atualizar implantação (mesmo link)
        run: |
          DEP_ID=$(clasp deployments | grep -oE 'AKfy[A-Za-z0-9_-]+' | tail -1)
          if [ -z "$DEP_ID" ]; then echo "Nenhuma implantação encontrada"; exit 1; fi
          clasp deploy -i "$DEP_ID" -d "Auto: ${GITHUB_SHA::7}"
