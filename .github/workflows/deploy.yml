name: Publicar no Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', '.clasp.json']
  workflow_dispatch:

# Um envio por vez; se chegar outro enquanto um roda, só o mais novo espera (evita código antigo sobrescrever o novo)
concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar clasp
        run: npm install -g @google/clasp@3
      - name: Credencial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Segredo CLASPRC_JSON ausente"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Enviar código
        run: clasp push --force
      # O FlowTask é aberto pelo link /dev, que sempre roda o último código enviado:
      # o "clasp push" acima já basta. Se um dia usar um link /exec, defina a
      # variável DEPLOYMENT_ID do repositório e esta etapa atualiza essa implantação.
      - name: Atualizar implantação /exec (opcional)
        if: ${{ vars.DEPLOYMENT_ID != '' }}
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          clasp deploy -i "$DEPLOYMENT_ID" -d "Auto ${GITHUB_SHA::7}"
