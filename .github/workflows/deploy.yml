name: Publicar no Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', '.clasp.json']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar clasp
        run: npm install -g @google/clasp@3
      - name: Credencial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Segredo CLASPRC_JSON ausente"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Enviar código
        run: clasp push --force
      - name: Atualizar implantação (mesmo link)
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          clasp deployments | tee deployments.txt
          if [ -n "$DEPLOYMENT_ID" ]; then
            DEP="$DEPLOYMENT_ID"
          else
            # implantações versionadas (ignora a @HEAD, que é só de teste)
            mapfile -t IDS < <(grep -v '@HEAD' deployments.txt | grep -oE 'AKfy[A-Za-z0-9_-]+' | sort -u)
            if [ "${#IDS[@]}" -ne 1 ]; then
              echo "::error::Encontradas ${#IDS[@]} implantações. Defina a variável DEPLOYMENT_ID do repositório com a do FlowTask."
              exit 1
            fi
            DEP="${IDS[0]}"
          fi
          clasp deploy -i "$DEP" -d "Auto: ${GITHUB_SHA::7}"
